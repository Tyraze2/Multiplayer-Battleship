<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Game</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Battleship Game</h1>
    <h2 id="lobbyname"></h2>
    <div id="game-container">
        <div id="player-board" class="board">
            <h2>Your Board</h2>
            <div class="grid"></div>
        </div>
        <div id="opponent-board" class="board">
            <h2>Opponent's Board</h2>
            <div class="grid"></div>
        </div>
    </div>
    <button id="rotate-btn" onclick="rotate()">Rotate Ship</button>
    <select id="ship-select">
        <option length="5">Carrier (5 squares)</option>
        <option length="4">Battleship (4 squares)</option>
        <option length="3">Cruiser (3 squares)</option>
        <option length="3">Submarine (3 squares)</option>
        <option length="2">Destroyer (2 squares)</option>
    </select>
    <div id="status"></div>
    <script src="game.js"></script>
</body>
</html>
